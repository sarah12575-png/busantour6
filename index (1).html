<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산 명소 - 부산의 숨겨진 매력을 찾다</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0066cc;
            --primary-dark: #003d7a;
            --accent-coral: #ff6b5b;
            --accent-gold: #ffc107;
            --text-dark: #1a1a1a;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --border-color: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        html, body {
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2rem 1.5rem;
            box-shadow: var(--shadow-md);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.95;
            font-weight: 300;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Search Section */
        .search-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-wrapper {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .btn-search {
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .btn-search.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Filter Section */
        .filter-section {
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }

        .filter-label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-dark);
        }

        .filter-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .filter-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
            color: white;
        }

        /* Results Grid */
        .results-section {
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .sort-controls {
            display: flex;
            gap: 0.5rem;
        }

        .sort-btn {
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .sort-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .attractions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* Card */
        .attraction-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            animation: cardIn 0.5s ease-out backwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .attraction-card:nth-child(1) { animation-delay: 0.05s; }
        .attraction-card:nth-child(2) { animation-delay: 0.1s; }
        .attraction-card:nth-child(3) { animation-delay: 0.15s; }
        .attraction-card:nth-child(n+4) { animation-delay: 0.2s; }

        .attraction-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 66.67%;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .attraction-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent-coral);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-location {
            font-size: 0.85rem;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .card-info {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: var(--bg-light);
            border-radius: 6px;
        }

        .card-info-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .card-info-item:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .btn-detail {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-detail:hover {
            background: var(--primary-dark);
            transform: translateX(2px);
        }

        .btn-favorite {
            padding: 0.75rem 1rem;
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-favorite:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: white;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .pagination button {
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            flex: 1;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-dark);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-info-group {
            margin-bottom: 1.5rem;
        }

        .modal-info-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .modal-info-value {
            color: var(--text-light);
            line-height: 1.6;
            word-break: break-word;
        }

        .modal-info-value a {
            color: var(--primary-blue);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .modal-info-value a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: var(--text-dark);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5rem;
            }

            .search-wrapper {
                flex-direction: column;
            }

            .btn-search {
                width: 100%;
            }

            .attractions-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .results-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-title {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            header {
                padding: 1.5rem 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .search-section {
                padding: 1.5rem;
            }

            .attractions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌊 부산 명소</h1>
        <p>부산의 숨겨진 매력을 찾아보세요</p>
    </header>

    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="명소 이름으로 검색해보세요..."
                >
                <button class="btn-search" id="searchBtn">검색</button>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <label class="filter-label">지역별 필터</label>
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="영도구">영도구</button>
                    <button class="filter-btn" data-filter="중구">중구</button>
                    <button class="filter-btn" data-filter="서구">서구</button>
                    <button class="filter-btn" data-filter="동구">동구</button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-info">
                <span class="results-count">검색 결과: <strong id="resultCount">0</strong>개</span>
                <div class="sort-controls">
                    <button class="sort-btn active" data-sort="name">이름순</button>
                    <button class="sort-btn" data-sort="distance">거리순</button>
                </div>
            </div>

            <div class="attractions-grid" id="attractionsGrid"></div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- Loading State -->
        <div class="loading-container" id="loadingContainer" style="display: none;">
            <div class="spinner"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🔍</div>
            <h3>검색 결과가 없습니다</h3>
            <p>다른 검색어를 시도해보세요</p>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>부산명소정보 | 부산광역시 제공 공공데이터</p>
        <p style="margin-top: 0.5rem; opacity: 0.8;">© 2024 부산 명소. All rights reserved.</p>
    </footer>

    <script>
        const API_BASE = '/api';
        const ITEMS_PER_PAGE = 12;
        
        let allAttractions = [];
        let filteredAttractions = [];
        let currentPage = 1;
        let currentFilter = 'all';
        let currentSort = 'name';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            attachEventListeners();
        });

        function attachEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    currentPage = 1;
                    applyFilters();
                });
            });

            // Sort buttons
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentSort = e.target.dataset.sort;
                    renderGrid();
                });
            });
        }

        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('검색어를 입력해주세요');
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/attractions?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    allAttractions = data.data || [];
                    currentPage = 1;
                    currentFilter = 'all';
                    document.querySelector('[data-filter="all"]').click();
                    applyFilters();
                } else {
                    showEmpty();
                }
            } catch (error) {
                console.error('Search error:', error);
                alert('검색 중 오류가 발생했습니다');
            } finally {
                showLoading(false);
            }
        }

        function applyFilters() {
            filteredAttractions = allAttractions;

            if (currentFilter !== 'all') {
                filteredAttractions = filteredAttractions.filter(item => 
                    item.GUGUN_NM === currentFilter
                );
            }

            if (filteredAttractions.length === 0) {
                showEmpty();
            } else {
                renderGrid();
                document.getElementById('resultsSection').style.display = 'block';
                document.getElementById('emptyState').style.display = 'none';
            }
        }

        function sortAttractions(items) {
            const sorted = [...items];
            if (currentSort === 'name') {
                sorted.sort((a, b) => a.MAIN_TITLE.localeCompare(b.MAIN_TITLE, 'ko'));
            }
            return sorted;
        }

        function renderGrid() {
            const sorted = sortAttractions(filteredAttractions);
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = sorted.slice(start, end);

            const grid = document.getElementById('attractionsGrid');
            grid.innerHTML = pageItems.map(item => createCard(item)).join('');

            // Update result count
            document.getElementById('resultCount').textContent = filtered.Attractions.length;

            // Render pagination
            renderPagination(sorted.length);

            // Attach card listeners
            document.querySelectorAll('.btn-detail').forEach(btn => {
                btn.addEventListener('click', () => {
                    const itemId = btn.dataset.id;
                    const item = filteredAttractions.find(a => a.UC_SEQ == itemId);
                    showModal(item);
                });
            });

            document.querySelectorAll('.btn-favorite').forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.style.opacity = '0.7';
                    setTimeout(() => btn.style.opacity = '1', 200);
                });
            });
        }

        function createCard(item) {
            const imageUrl = item.MAIN_IMG_NORMAL ? 
                `https://api.busan.go.kr${item.MAIN_IMG_NORMAL}` : 
                'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/%3E%3C/svg%3E';

            return `
                <div class="attraction-card">
                    <div class="card-image-wrapper">
                        <img 
                            src="${imageUrl}" 
                            alt="${item.MAIN_TITLE}" 
                            class="card-image"
                            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3EImage not available%3C/text%3E%3C/svg%3E'"
                        >
                        <span class="card-badge">${item.GUGUN_NM}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-location">${item.GUGUN_NM}</div>
                        <h3 class="card-title">${item.MAIN_TITLE}</h3>
                        <p class="card-subtitle">${item.SUBTITLE || ''}</p>
                        <div class="card-info">
                            ${item.USAGE_AMOUNT ? `<div class="card-info-item"><span class="info-icon">💰</span><span>${item.USAGE_AMOUNT}</span></div>` : ''}
                            ${item.CNTCT_TEL ? `<div class="card-info-item"><span class="info-icon">📞</span><span>${item.CNTCT_TEL}</span></div>` : ''}
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-detail" data-id="${item.UC_SEQ}">상세보기</button>
                        <button class="btn-favorite">♡</button>
                    </div>
                </div>
            `;
        }

        function showModal(item) {
            document.getElementById('modalTitle').textContent = item.MAIN_TITLE;
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                ${item.MAIN_IMG_NORMAL ? `<img src="https://api.busan.go.kr${item.MAIN_IMG_NORMAL}" alt="${item.MAIN_TITLE}" style="width: 100%; border-radius: 8px; margin-bottom: 1.5rem;">` : ''}
                
                <div class="modal-info-group">
                    <div class="modal-info-label">제목</div>
                    <div class="modal-info-value">${item.TITLE || item.MAIN_TITLE}</div>
                </div>

                <div class="modal-info-group">
                    <div class="modal-info-label">부제목</div>
                    <div class="modal-info-value">${item.SUBTITLE || '-'}</div>
                </div>

                <div class="modal-info-group">
                    <div class="modal-info-label">주소</div>
                    <div class="modal-info-value">${item.ADDR1 || '-'}</div>
                </div>

                ${item.LAT && item.LNG ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">위치 (좌표)</div>
                    <div class="modal-info-value">위도: ${item.LAT}, 경도: ${item.LNG}</div>
                </div>
                ` : ''}

                ${item.CNTCT_TEL ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">연락처</div>
                    <div class="modal-info-value"><a href="tel:${item.CNTCT_TEL}">${item.CNTCT_TEL}</a></div>
                </div>
                ` : ''}

                ${item.HOMEPAGE_URL ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">홈페이지</div>
                    <div class="modal-info-value"><a href="${item.HOMEPAGE_URL}" target="_blank" rel="noopener noreferrer">${item.HOMEPAGE_URL}</a></div>
                </div>
                ` : ''}

                ${item.USAGE_AMOUNT ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">이용요금</div>
                    <div class="modal-info-value">${item.USAGE_AMOUNT}</div>
                </div>
                ` : ''}

                ${item.USAGE_DAY_WEEK_AND_TIME ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">운영시간</div>
                    <div class="modal-info-value">${item.USAGE_DAY_WEEK_AND_TIME}</div>
                </div>
                ` : ''}

                ${item.HLDY_INFO ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">휴무일</div>
                    <div class="modal-info-value">${item.HLDY_INFO}</div>
                </div>
                ` : ''}

                ${item.TRFC_INFO ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">교통정보</div>
                    <div class="modal-info-value">${item.TRFC_INFO.replace(/\n/g, '<br>')}</div>
                </div>
                ` : ''}

                ${item.MIDDLE_SIZE_RM1 ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">편의시설</div>
                    <div class="modal-info-value">${item.MIDDLE_SIZE_RM1.replace(/\n/g, '<br>')}</div>
                </div>
                ` : ''}

                ${item.ITEMCNTNTS ? `
                <div class="modal-info-group">
                    <div class="modal-info-label">상세설명</div>
                    <div class="modal-info-value">${item.ITEMCNTNTS.replace(/\n/g, '<br>')}</div>
                </div>
                ` : ''}
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            // Previous button
            if (currentPage > 1) {
                html += `<button onclick="goToPage(${currentPage - 1})">← 이전</button>`;
            } else {
                html += `<button disabled>← 이전</button>`;
            }

            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<span>...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `<button class="active">${i}</button>`;
                } else {
                    html += `<button onclick="goToPage(${i})">${i}</button>`;
                }
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span>...</span>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            if (currentPage < totalPages) {
                html += `<button onclick="goToPage(${currentPage + 1})">다음 →</button>`;
            } else {
                html += `<button disabled>다음 →</button>`;
            }

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderGrid();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showLoading(show) {
            document.getElementById('loadingContainer').style.display = show ? 'flex' : 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
        }

        function showEmpty() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Close modal when clicking outside
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
